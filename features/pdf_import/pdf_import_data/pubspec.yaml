name: pdf_import_data
description: "A new Flutter package project."
version: 0.0.1
homepage:
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: ">=1.17.0"

dependencies:
  daily_metrics_domain:
    path: ../../../packages/shared/daily_metrics_domain
  failures:
    path: ../../../packages/shared/failures
  flutter:
    sdk: flutter
  meta: ^1.16.0
  pdf_import_domain:
    path: ../pdf_import_domain
  # Not imported: carries PDFium's native library. On iOS it's the only
  # source (pdfium_dart's build hook skips PDFium there); it links the
  # XCFramework into the app on iOS and macOS. Keep in step with pdfrx_engine's
  # pdfium_dart version.
  pdfium_flutter: ^0.4.0
  pdfrx_engine: ^0.7.4

dev_dependencies:
  daily_metrics_data:
    path: ../../../packages/shared/daily_metrics_data
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

