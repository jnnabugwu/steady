name: cravings_presentation
description: "Craving support (iPhone): the guided craving flow, the home entry point and weekly line, and the Settings card."
version: 0.0.1
homepage:
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: ">=1.17.0"

dependencies:
  cravings_domain:
    path: ../cravings_domain
  failures:
    path: ../../../packages/shared/failures
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  riverpod_annotation: ^4.0.7
  shadcn_flutter: ^0.0.53
  ui_kit:
    path: ../../../packages/shared/ui_kit
  # Opens the Settings card's help link (ANAD) in the browser.
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.16.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
