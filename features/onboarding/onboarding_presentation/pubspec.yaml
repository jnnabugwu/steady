name: onboarding_presentation
description: "Onboarding's screens: the ten-step first-run flow, its controller and the cairn that tracks it."
version: 0.0.1
homepage:
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: ">=1.17.0"

dependencies:
  failures:
    path: ../../../packages/shared/failures
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  # Domain only: never onboarding_data (CLAUDE.md §3). No other feature's
  # packages either: the coach's consent and Apple Health are reached
  # through the Module's callbacks, which the app wires.
  onboarding_domain:
    path: ../onboarding_domain
  riverpod_annotation: ^4.0.7
  shadcn_flutter: ^0.0.53
  ui_kit:
    path: ../../../packages/shared/ui_kit

dev_dependencies:
  build_runner: ^2.16.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
