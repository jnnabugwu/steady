name: subscription_data
description: "The coach's subscription on RevenueCat (purchases_flutter, StoreKit 2): the only package that imports the purchase SDK."
version: 0.0.1
homepage:
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: ">=1.17.0"

dependencies:
  failures:
    path: ../../../packages/shared/failures
  flutter:
    sdk: flutter
  # A regular dependency only for lib/testing/ (the shared repository
  # contract), which app/ tests can import too. Nothing under lib/src/
  # imports it.
  flutter_test:
    sdk: flutter
  # Pinned exactly: it's on the purchase path, and 11.0.3 is the version
  # docs/research/revenuecat_paywall.md checked (StoreKit 2 by default,
  # Swift Package Manager). Move it on deliberately, after reading the
  # changelog.
  purchases_flutter: 11.0.3
  subscription_domain:
    path: ../subscription_domain

dev_dependencies:
  very_good_analysis: ^11.0.0

flutter:
