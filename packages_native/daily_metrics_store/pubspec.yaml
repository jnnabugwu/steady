name: daily_metrics_store
description: >-
  Native side of the shared DailyMetric store: a SwiftData @Model behind the
  `steady/daily_metrics` MethodChannel, for iOS and macOS. A thin bridge; the
  Dart client and every domain rule live in daily_metrics_data.
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  very_good_analysis: ^11.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: DailyMetricsStorePlugin
        sharedDarwinSource: true
      macos:
        pluginClass: DailyMetricsStorePlugin
        sharedDarwinSource: true
